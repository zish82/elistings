# eListings: app + PostgreSQL (+ optional Caddy for HTTPS on a server).
#
#   Local:      cp .env.example .env   (fill in values)   then   docker compose up --build
#               App: http://localhost:8080
#   Server:     set DOMAIN in .env and run   docker compose --profile https up -d --build
#               Caddy gets a free HTTPS certificate for DOMAIN automatically.
#
# Data lives in the "pgdata" volume (back it up – see DEPLOY.md).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elistings}
      POSTGRES_USER: ${POSTGRES_USER:-elistings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Only reachable from this machine (for tools / the one-off SQLite copy). Remove if not needed.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elistings} -d ${POSTGRES_DB:-elistings}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-elistings};Username=${POSTGRES_USER:-elistings};Password=${POSTGRES_PASSWORD}"
      # eBay (production keys from developer.ebay.com). RuName "auth accepted URL" must be https://DOMAIN/api/auth/callback
      EbaySettings__AppId: ${EBAY_APP_ID:-}
      EbaySettings__CertId: ${EBAY_CERT_ID:-}
      EbaySettings__DevId: ${EBAY_DEV_ID:-}
      EbaySettings__RuName: ${EBAY_RUNAME:-}
      EbaySettings__RedirectUri: https://${DOMAIN:-localhost}/api/auth/callback
      EbaySettings__IsSandbox: ${EBAY_IS_SANDBOX:-false}
      # Supplier trade logins
      EdenSupplier__Username: ${EDEN_USERNAME:-}
      EdenSupplier__Password: ${EDEN_PASSWORD:-}
      DropShipMall__Username: ${DSM_USERNAME:-}
      DropShipMall__Password: ${DSM_PASSWORD:-}
      # Digital Club website contact form → email (leave CONTACT_TO_EMAIL or SMTP_HOST empty to switch it off)
      Contact__ToEmail: ${CONTACT_TO_EMAIL:-}
      Contact__FromEmail: ${CONTACT_FROM_EMAIL:-}
      Contact__Smtp__Host: ${SMTP_HOST:-}
      Contact__Smtp__Port: ${SMTP_PORT:-587}
      Contact__Smtp__Username: ${SMTP_USERNAME:-}
      Contact__Smtp__Password: ${SMTP_PASSWORD:-}
    ports:
      - "8080:8080"

  # Builds the static Digital Club website into sites/digitalclub/dist (runs once, then exits).
  site:
    image: node:22-alpine
    profiles: ["https"]
    working_dir: /site
    command: ["node", "build.mjs"]
    environment:
      SITE_URL: https://${SITE_DOMAIN:-site.localhost}
      ELISTINGS_URL: https://${DOMAIN:-localhost}
      CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-}
    volumes:
      - ./sites/digitalclub:/site

  # HTTPS reverse proxy for a real server: docker compose --profile https up -d
  # Serves the app on DOMAIN and the Digital Club website on SITE_DOMAIN.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      site:
        condition: service_completed_successfully
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env for HTTPS}
      SITE_DOMAIN: ${SITE_DOMAIN:-site.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites/digitalclub/dist:/srv/digitalclub:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
